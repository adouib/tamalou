<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TamTamDZ</title>
<meta name="theme-color" content="#0B0F1A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TamTamDZ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Fraunces:opsz,wght@9..144,700;9..144,900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0F1A; --bg2:#121829; --surface:#161D30; --surface2:#1E2740; --line:rgba(255,255,255,.09);
  --accent:#C8F03C; --accent-ink:#13200A; --danger:#E5484D; --card:#FFFFFF; --ink:#15181F;
  --red:#D93C44; --text:#F5F6FA; --mute:#8E97AD; --back:#243061;
  --ui:"Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --num:"Fraunces", Georgia, "Times New Roman", serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#0B0F1A; } }
:root[data-theme="dark"]{ --bg:#0B0F1A; }
html{ height:100%; min-height:100%; background:var(--bg); scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:inherit; }
body{ margin:0; min-height:100%; font-family:var(--ui); color:var(--text); background:linear-gradient(180deg,var(--bg2) 0%,var(--bg) 60%); -webkit-tap-highlight-color:transparent; }
#app{ max-width:520px; margin:0 auto; min-height:100%; display:flex; flex-direction:column; }
button{ font:inherit; color:inherit; cursor:pointer; }
button:focus-visible, input:focus-visible{ outline:3px solid var(--accent); outline-offset:2px; }
.page{ padding:14px 16px 24px; display:flex; flex-direction:column; gap:14px; }

/* ---------- Home ---------- */
.hero{ text-align:center; padding:28px 0 4px; }
.hero h1{ font-family:var(--num); font-weight:900; font-size:clamp(48px,15vw,76px); line-height:.95; margin:0; letter-spacing:-.02em; }
.hero p{ color:var(--mute); margin:12px auto 0; max-width:32ch; line-height:1.45; font-size:15px; }
.fan{ display:flex; justify-content:center; align-items:flex-end; height:118px; margin:18px 0 0; }
.fan .slot{ margin:0 -16px; transform-origin:50% 120%; }
.fan .slot:nth-child(1){ transform:rotate(-16deg); } .fan .slot:nth-child(2){ transform:rotate(-5deg); }
.fan .slot:nth-child(3){ transform:rotate(5deg); } .fan .slot:nth-child(4){ transform:rotate(16deg); }
.panel{ background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:16px; display:flex; flex-direction:column; gap:10px; }
.panel h2{ font-size:16px; margin:0; font-weight:600; }
label.field{ font-size:13px; color:var(--mute); display:flex; flex-direction:column; gap:6px; }
input{ font:inherit; font-size:17px; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:var(--bg); color:var(--text); width:100%; }
input.code{ text-transform:uppercase; letter-spacing:.3em; font-family:var(--num); font-size:22px; text-align:center; }
.row{ display:flex; gap:10px; }
.btn{ border:1px solid var(--line); border-radius:12px; padding:12px 14px; font-weight:600; font-size:15px; background:var(--surface2); line-height:1.2; }
.btn.main{ background:var(--accent); color:var(--accent-ink); border-color:transparent; }
.btn.call{ background:var(--danger); color:#fff; border-color:transparent; }
.btn.on{ background:var(--text); color:var(--ink); border-color:transparent; }
.btn:disabled{ opacity:.35; cursor:default; }
.btn.wide{ width:100%; }
.link{ background:none; border:0; color:var(--mute); font-size:14px; padding:6px 4px; text-decoration:underline; text-underline-offset:3px; }
.note{ color:var(--mute); font-size:14px; line-height:1.45; margin:0; }
.note.err{ color:#FF8A8F; }
.conn{ margin:0; text-align:center; font-size:13px; color:var(--mute); }
.conn.ok{ color:var(--accent); }
.conn.ko{ color:#FF8A8F; }

/* ---------- Cards ---------- */
.slot{ position:relative; border:0; padding:0; border-radius:8px; aspect-ratio:5/7; display:block; background:none; flex:none; }
.fly.slot{ aspect-ratio:auto; }
.slot.big{ width:clamp(62px,19vw,84px); }
.hand{ position:relative; }
.hand .extra{ position:absolute; bottom:calc(100% + 6px); left:0; right:0; display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
.seat .extra{ display:flex; gap:4px; flex-wrap:wrap; padding-bottom:3px; border-bottom:1px dashed var(--line); margin-bottom:1px; }
.slot.mid{ width:clamp(54px,15vw,66px); }
.slot.mini{ width:24px; border-radius:4px; }
.slot.empty{ border:1.5px dashed rgba(255,255,255,.16); }
.back{ position:absolute; inset:0; border-radius:inherit; background:var(--back);
  box-shadow:inset 0 0 0 2px #fff, inset 0 0 0 3px var(--back), 0 2px 5px rgba(0,0,0,.4); }
.back::after{ content:""; position:absolute; inset:18% 20%; border-radius:4px; border:1.5px solid rgba(200,240,60,.9); background:repeating-linear-gradient(135deg,transparent 0 5px,rgba(200,240,60,.18) 5px 6px); }
.slot.mini .back{ box-shadow:inset 0 0 0 1.5px #fff, 0 1px 3px rgba(0,0,0,.35); }
.slot.mini .back::after{ inset:22% 24%; border-width:1px; background:none; opacity:.6; }
.slot .f{ position:absolute; inset:0; border-radius:inherit; background:var(--card); color:var(--ink); box-shadow:0 2px 5px rgba(0,0,0,.4); font-family:var(--num); font-weight:700; }
.slot .f.red{ color:var(--red); }
.slot .f.joker{ color:#4C6B0A; background:linear-gradient(160deg,#F7FFD6,#E4F79A); }
.slot .f .ix{ position:absolute; top:6%; left:9%; font-size:clamp(14px,4.2vw,19px); line-height:.9; display:flex; flex-direction:column; align-items:center; }
.slot .f .ix i{ font-style:normal; font-size:.72em; margin-top:1px; }
.slot .f .ix.rot{ top:auto; left:auto; bottom:6%; right:9%; transform:rotate(180deg); }
.slot .f .pip{ position:absolute; inset:0; display:grid; place-items:center; font-size:clamp(24px,7vw,34px); }
.slot .f .pip.art{ inset:17% 15% 21% 15%; }
.slot .f .pip.art svg{ width:100%; height:100%; display:block; }
.slot .f.red .pip.art{ color:var(--red); } .slot .f:not(.red):not(.joker) .pip.art{ color:#2E3A8C; }
.slot.mini .f .ix{ position:static; height:100%; justify-content:center; font-size:11px; line-height:1; }
.slot.mini .f .ix i{ display:none; }
.slot.mini .f .pip,.slot.mini .f .ix.rot{ display:none; }
.slot.mini .f.joker .ix{ font-size:9px; }
.slot.pick{ cursor:pointer; }
.slot.pick::after{ content:""; position:absolute; inset:-4px; border-radius:11px; border:2.5px solid var(--accent); }
.slot.mini.pick::after{ inset:-3px; border-radius:6px; border-width:2px; }
.slot.sel::after{ border-color:#fff; }
.slot.seen .f{ box-shadow:0 0 0 3px var(--accent), 0 2px 6px rgba(0,0,0,.4); }

/* ---------- Table ---------- */
.screen{ min-height:100dvh; display:flex; flex-direction:column; padding:10px 14px 12px; gap:10px; }
.bar{ display:flex; align-items:center; justify-content:space-between; gap:10px; min-height:32px; }
.bar .brand{ font-family:var(--num); font-weight:900; font-size:20px; }
.bar .meta{ color:var(--mute); font-size:12px; white-space:nowrap; }
.bar .links{ display:flex; gap:2px; white-space:nowrap; align-items:center; }
.bar .link[data-a="mute"]{ text-decoration:none; font-size:15px; }
.bar .link{ font-size:13px; }
.drawrow{ display:flex; gap:10px; align-items:center; justify-content:center; flex-wrap:wrap; font-size:12px; }
.drawrow b{ color:var(--accent); }
.drawc{ display:flex; flex-direction:column; align-items:center; gap:3px; font-size:11px; color:var(--mute); }
.drawc .slot.mini{ width:30px; }
.drawc.win{ color:var(--text); font-weight:600; }
.drawc.win .slot.mini .f{ box-shadow:0 0 0 2px var(--accent); }
@media (prefers-reduced-motion: no-preference){ .flip{ animation:flip .9s ease both; } @keyframes flip{ 0%{ transform:rotateY(90deg); opacity:0 } 60%{ transform:rotateY(-10deg); opacity:1 } 100%{ transform:none } } }
.opps{ display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; padding:2px 0 4px; }
.opps::-webkit-scrollbar{ display:none; }
.seat{ flex:none; display:flex; flex-direction:column; gap:6px; padding:8px 10px; border-radius:14px; background:var(--surface); border:1px solid var(--line); min-width:92px; }
.seat.turn{ border-color:var(--accent); }
.seat .head{ display:flex; align-items:center; gap:6px; }
.seat .av{ width:22px; height:22px; border-radius:50%; background:var(--surface2); color:var(--text); font-size:11px; font-weight:800; display:grid; place-items:center; flex:none; }
.seat.turn .av{ background:var(--accent); color:var(--accent-ink); }
.seat .nm{ font-size:13px; font-weight:600; max-width:90px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.seat .sub{ font-size:11px; color:var(--mute); display:flex; gap:6px; align-items:center; }
.tag{ display:inline-block; font-size:10px; font-weight:700; padding:1px 6px; border-radius:99px; background:var(--danger); color:#fff; }
.seat .grid{ display:grid; grid-template-columns:repeat(2,24px); gap:4px; }

.center{ display:flex; justify-content:center; align-items:flex-end; gap:16px; padding:8px 0 2px; }
.pile{ display:flex; flex-direction:column; align-items:center; gap:5px; font-size:11px; color:var(--mute); }
.pile .slot{ cursor:default; } .pile button.slot{ border:0; padding:0; }
.pile .lbl b{ color:var(--text); font-weight:600; }
.count{ position:absolute; right:-6px; top:-6px; background:var(--text); color:var(--ink); font-size:11px; font-weight:700; border-radius:99px; padding:1px 6px; z-index:1; }
.status{ text-align:center; font-size:14px; line-height:1.35; color:var(--text); padding:0 4px; min-height:36px; display:grid; place-items:center; }
.status span{ display:block; }
.status b{ color:var(--accent); font-weight:600; }
.banner{ text-align:center; background:var(--danger); color:#fff; border-radius:10px; padding:7px 12px; font-weight:600; font-size:13px; }
.banner.give{ background:var(--accent); color:var(--accent-ink); }
.chips{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; min-height:34px; }
.chip{ border-radius:999px; padding:8px 14px; font-size:13px; font-weight:600; background:var(--surface2); border:1px solid var(--line); line-height:1.1; }
.chip.main{ background:var(--accent); color:var(--accent-ink); border-color:transparent; }
.chip.call{ background:var(--danger); color:#fff; border-color:transparent; }
.status .dim{ color:var(--mute); }
.slot.pilebtn{ cursor:default; }
.slot.pilebtn.pick{ cursor:pointer; }
.slot.pilebtn:disabled{ opacity:1; }
.fly{ border-radius:8px; }
.fly.mini{ border-radius:4px; }
.slot.flash .back, .slot.flash .f{ box-shadow:0 0 0 3px var(--accent), 0 0 22px rgba(200,240,60,.85); }
.slot.lift{ z-index:5; }
@media (prefers-reduced-motion: no-preference){ .slot.lift{ animation:lift 2.4s ease both; } @keyframes lift{ 0%{ transform:none } 20%{ transform:translateY(-16px) scale(1.12) } 75%{ transform:translateY(-16px) scale(1.12) } 100%{ transform:none } } }
.slot.lift .back, .slot.lift .f{ box-shadow:0 0 0 3px var(--accent), 0 10px 24px rgba(0,0,0,.6); }
.spark{ text-shadow:0 0 6px rgba(200,240,60,.9); }
.slot.mini.flash .back, .slot.mini.flash .f{ box-shadow:0 0 0 2px var(--accent), 0 0 10px rgba(200,240,60,.7); }
@media (prefers-reduced-motion: no-preference){ .slot .back, .slot .f{ transition:box-shadow .3s; } }
.dock{ margin-top:auto; display:flex; flex-direction:column; gap:8px; }
.hand{ display:flex; flex-direction:column; align-items:center; gap:6px; padding:12px 10px 8px; border-radius:18px; background:var(--surface); border:1px solid var(--line); }
.hand .grid{ display:grid; grid-template-columns:repeat(2,auto); gap:10px; }

.hand.myturn{ border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; }
.hand .who{ font-size:12px; color:var(--mute); }
.log{ font-size:12px; color:var(--mute); text-align:center; padding:0 6px; min-height:16px; }
.log .link{ font-size:12px; padding:0; }
.hostbar{ display:flex; justify-content:center; }

/* ---------- Lobby & scores ---------- */
.limit{ display:flex; flex-direction:column; gap:6px; align-items:center; }
.limit .chips{ min-height:0; }
.bigcode{ font-family:var(--num); font-weight:900; font-size:56px; letter-spacing:.18em; text-align:center; margin:2px 0; color:var(--accent); }
.plist{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; }
.plist li{ display:flex; justify-content:space-between; align-items:center; padding:10px 12px; background:var(--bg); border-radius:10px; }
.score{ display:flex; flex-direction:column; gap:8px; }
.srow{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:10px 12px; display:grid; grid-template-columns:1fr auto; gap:6px 10px; align-items:center; }
.srow .nm{ font-weight:600; display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
.srow .nums{ display:flex; align-items:baseline; gap:8px; justify-content:flex-end; }
.srow .num{ font-family:var(--num); font-size:26px; font-weight:900; }
.srow .plus{ color:var(--accent); }
.srow .eq{ color:var(--mute); font-size:14px; }
.srow .tot.done{ animation:pop .4s ease; }
@keyframes pop{ 50%{ transform:scale(1.18); } }
.tag.go{ background:var(--accent); color:var(--accent-ink); }
.srow.rwin{ border-color:rgba(200,240,60,.5); }
.srow.show{ grid-template-columns:1fr; gap:8px; transition:opacity .4s, transform .4s; }
.srow.show .cards{ gap:6px; }
.srow.show .cards .slot.mid{ width:clamp(44px,12.5vw,58px); }
.srow.show .nums{ justify-content:flex-start; align-items:baseline; gap:8px; }
.srow.show .lbl2{ color:var(--mute); font-size:12px; }
.srow.show .hand{ color:var(--text); }
.srow.active{ border-color:var(--accent); background:linear-gradient(100deg,var(--surface) 20%,var(--surface2) 50%,var(--surface) 80%); background-size:250% 100%; animation:sweep 1.4s linear infinite; transform:scale(1.015); }
@keyframes sweep{ from{ background-position:200% 0 } to{ background-position:-100% 0 } }
.srow.done{ opacity:.78; }
.slot.down .f{ opacity:0; }
.slot.up .back{ display:none; }
@media (prefers-reduced-motion: no-preference){ .slot.up .f{ animation:flipIn .45s ease; } @keyframes flipIn{ from{ transform:rotateY(90deg) } to{ transform:none } } }
.hidden{ visibility:hidden; }
.verdict{ text-align:center; padding:14px 12px; border-radius:14px; font-weight:700; font-size:17px; line-height:1.35; }
.verdict.ok{ background:var(--accent); color:var(--accent-ink); animation:pop .5s ease; }
.verdict.ko{ background:var(--danger); color:#fff; animation:shake .5s ease; }
@keyframes shake{ 20%{ transform:translateX(-6px) } 40%{ transform:translateX(6px) } 60%{ transform:translateX(-4px) } 80%{ transform:translateX(4px) } }
.overlay{ position:fixed; inset:0; z-index:40; background:rgba(11,15,26,.96); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:24px; text-align:center; animation:fadeIn .35s ease; }
.overlay.out{ animation:fadeOut .4s ease forwards; }
@keyframes fadeIn{ from{ opacity:0 } } @keyframes fadeOut{ to{ opacity:0 } }
.ovtitle{ font-family:var(--num); font-weight:900; font-size:34px; }
.ovcards{ display:flex; gap:16px; flex-wrap:wrap; justify-content:center; min-height:150px; align-items:flex-start; }
.ovcard{ display:flex; flex-direction:column; align-items:center; gap:6px; font-size:14px; color:var(--mute); }
.ovcard .slot.big{ width:clamp(74px,22vw,100px); }
.ovcard .n{ font-weight:600; color:var(--text); }
.ovcard.win .slot .f{ box-shadow:0 0 0 3px var(--accent), 0 0 34px rgba(200,240,60,.85); }
.ovcard.win .n{ color:var(--accent); }
.ovmsg{ min-height:28px; font-size:20px; font-weight:600; }
.ovmsg b{ color:var(--accent); }
@media (prefers-reduced-motion: no-preference){ .slot.deal{ animation:dealIn .6s cubic-bezier(.2,.8,.2,1) both; } @keyframes dealIn{ from{ transform:translateY(-70vh) rotate(-25deg) scale(.6); opacity:0 } to{ transform:none; opacity:1 } } }
.srow .det{ font-size:12px; color:var(--mute); }
.srow .cards{ display:flex; gap:4px; flex-wrap:wrap; grid-column:1 / -1; }
.srow .cards .slot.mini{ width:30px; }
.srow.win{ border-color:var(--accent); }
.rules{ font-size:14px; line-height:1.5; }
.rules table{ border-collapse:collapse; width:100%; margin:6px 0; }
.rules td{ padding:5px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
.rules td:first-child{ font-family:var(--num); white-space:nowrap; color:var(--accent); }
details summary{ cursor:pointer; color:var(--mute); font-size:14px; }

#toast{ position:fixed; left:50%; bottom:calc(18px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--accent); color:var(--accent-ink); padding:10px 16px; border-radius:12px; font-size:14px; font-weight:600; box-shadow:0 6px 20px rgba(0,0,0,.4); max-width:90vw; text-align:center; z-index:10; display:none; }
@media (prefers-reduced-motion: no-preference){
  .hand.myturn{ animation:glow 2.2s ease-in-out infinite; }
  @keyframes glow{ 50%{ box-shadow:0 0 0 3px var(--accent) inset; } }
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>

const POWER_TXT={own:'regarder une de vos cartes',opp:'regarder une carte adverse',nine:'regarder deux cartes et échanger',ten:'échanger deux cartes adverses'};

function ls(k,v){ try{ if(v===undefined) return localStorage.getItem(k); if(v===null) localStorage.removeItem(k); else localStorage.setItem(k,v);}catch(e){ return null; } }
function esc(t){ return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function val(c){ if(c.r==='JK')return -1; if(c.r==='A')return 1; if(c.r==='J'||c.r==='Q')return 10; if(c.r==='K')return (c.s==='h'||c.s==='d')?0:(c.s==='s'?21:10); return +c.r; }
function powerOf(r){ return r==='7'?'own':r==='8'?'opp':r==='9'?'nine':r==='10'?'ten':null; }
function powerAvail(st,c,i){ const pw=powerOf(c.r); if(!pw) return null; if(pw==='ten' && st.players.filter((q,k)=>k!==i&&count(q)>0).length<2) return null; return pw; }
function cname(c){ return c.r==='JK'?'un Joker':(LABEL[c.r]||c.r)+SUIT[c.s]; }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function newDeck(){ const d=[]; let id=0; for(const s of 'hdsc') for(const r of RANKS) d.push({r,s,id:id++}); d.push({r:'JK',s:'x',id:id++},{r:'JK',s:'x',id:id++}); return shuffle(d); }
function count(p){ return p.slots.filter(Boolean).length; }
function mi(st){ return st?st.players.findIndex(p=>p.id===ME):-1; }
function top(st){ return st.discard.length?st.discard[st.discard.length-1]:null; }
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
let toastT;
function toast(msg){ toastEl.textContent=msg; toastEl.style.display='block'; clearTimeout(toastT); toastT=setTimeout(()=>toastEl.style.display='none',3200); }

/* ---------- Game logic (runs inside a locked read-modify-write) ---------- */
function log(st,t){ st.log=[{t,ts:Date.now()}].concat(st.log||[]).slice(0,30); }
function drawCard(st){
  if(!st.deck.length){
    if(st.discard.length<=1) return null;
    const t=st.discard.pop(); st.deck=shuffle(st.discard); st.discard=[t];
    log(st,'La pioche est vide : la défausse est remélangée');
  }
  return st.deck.pop();
}
function deal(st){
  st.round=(st.round||0)+1;
  const d=newDeck();
  st.players.forEach(p=>{ p.slots=[d.pop(),d.pop(),d.pop(),d.pop()]; p.ready=false; p.hand=null; });
  // first visible card must be worth more than 1
  const rejected=[]; let first=d.pop(); while(first && val(first)<=1){ rejected.push(first); first=d.pop(); }
  st.discard=[first]; st.deck=shuffle(d.concat(rejected));
  // who starts: round 1 → each player draws a card, highest starts; afterwards the winner of the previous round
  st.draw=null;
  if(st.round===1 || st.nextStarter==null || st.nextStarter>=st.players.length){
    const dd=newDeck(); let pool=st.players.map((_,k)=>k), cards={};
    let guard=0;
    while(pool.length>1 && guard++<10){ const vals=pool.map(k=>{ cards[k]=dd.pop(); return val(cards[k]); }); const mn=Math.min(...vals); const keep=pool.filter((k,j)=>vals[j]===mn); if(keep.length===pool.length){ pool=[pool[Math.floor(Math.random()*pool.length)]]; } else pool=keep; }
    st.turn=pool[0]; st.draw={cards:st.players.map((_,k)=>cards[k]||null),winner:pool[0]};
  } else st.turn=st.nextStarter;
  st.phase='peek'; st.step='start';
  st.held=null; st.heldFrom=null; st.power=null; st.nineLook=null; st.caller=null; st.gives=[]; st.callerWon=null;
  log(st,`Manche ${st.round} distribuée`);
}
function endTurn(st){
  st.held=null; st.heldFrom=null; st.power=null; st.nineLook=null; st.step='start';
  st.turn=(st.turn+1)%st.players.length;
}
function endRound(st){
  st.phase='reveal'; st.held=null; st.power=null; st.nineLook=null; st.step='start';
  const sums=st.players.map(p=>p.slots.filter(Boolean).reduce((a,c)=>a+val(c),0));
  const c=st.caller, min=Math.min(...sums);
  const strict=c!=null && sums[c]===min && sums.filter(x=>x===min).length===1;
  const othersSum=c==null?0:sums.reduce((a,x,j)=>j===c?a:a+x,0);
  st.players.forEach((p,k)=>{
    let sc;
    if(c==null) sc=sums[k]; else if(strict) sc=(k===c)?0:sums[k]; else sc=(k===c)?othersSum:0;
    p.hand=sums[k]; p.last=sc; p.total=(p.total||0)+sc;
  });
  st.callerWon=c==null?null:strict; st.gives=[];
  if(c!=null) log(st, strict?`${st.players[c].name} réussit son TamTam : 0 point`:`${st.players[c].name} rate son TamTam et prend ${othersSum} points`);
  // the round winner starts the next round
  if(c!=null&&strict) st.nextStarter=c;
  else { let bi=-1,bv=Infinity; st.players.forEach((p,k)=>{ if(k===c) return; if(sums[k]<bv){ bv=sums[k]; bi=k; } }); st.nextStarter=bi>=0?bi:0; }
  if(st.players.some(p=>p.total>(st.limit||100))) st.phase='over';
}
function checkEmpty(st,k){
  if(st.phase==='play' && st.caller===null && count(st.players[k])===0){
    st.caller=k; log(st,`${st.players[k].name} n’a plus de carte : TamTam automatique`); endRound(st);
  }
}
function needTurn(st,steps){
  const i=mi(st);
  if(i<0) return {err:'Vous ne jouez pas dans cette partie.'};
  if(st.phase!=='play') return {err:'La manche n’est pas en cours.'};
  if(st.turn!==i) return {err:'Ce n’est pas votre tour.'};
  if(steps && !steps.includes(st.step)) return {err:'Action impossible à ce moment.'};
  return {i,p:st.players[i]};
}
const A={
  join(st,{name}){
    if(mi(st)>=0) return;
    if(!['lobby','reveal','over'].includes(st.phase)) return 'Une manche est en cours : réessayez entre deux manches.';
    if(st.players.length>=6) return 'La table est complète (6 joueurs).';
    const start=st.phase==='lobby'?0:Math.max(0,...st.players.map(p=>p.total||0));
    st.players.push({id:ME,name,slots:[],ready:false,total:start,last:0,hand:null});
    log(st,`${name} rejoint la table`);
  },
  setLimit(st,{limit}){
    if(st.host!==ME) return 'Seul l’hôte choisit le total.';
    if(st.phase!=='lobby') return 'Le total se fixe avant la première manche.';
    st.limit=[50,100,150,200].includes(limit)?limit:100;
  },
  leave(st){
    const i=mi(st); if(i<0) return;
    const p=st.players[i];
    log(st,`${p.name} quitte la partie`);
    if(st.phase==='play'||st.phase==='peek'){
      p.slots.filter(Boolean).forEach(c=>st.deck.unshift(c)); if(st.held&&st.turn===i){ st.deck.unshift(st.held); } st.deck=shuffle(st.deck);
      if(st.turn===i){ st.held=null; st.heldFrom=null; st.power=null; st.nineLook=null; st.step='start'; }
    }
    st.players.splice(i,1);
    const fix=k=>k==null?null:(k>i?k-1:(k===i?null:k));
    st.turn = st.turn>i ? st.turn-1 : (st.turn===i ? (st.players.length? st.turn%st.players.length : 0) : st.turn);
    st.caller=fix(st.caller); st.nextStarter=fix(st.nextStarter);
    st.gives=(st.gives||[]).filter(g=>g.from!==i&&g.to!==i).map(g=>({from:fix(g.from),to:fix(g.to),s:g.s}));
    if(st.nineLook&&(st.nineLook.p===i)) st.nineLook=null; else if(st.nineLook) st.nineLook.p=fix(st.nineLook.p);
    if(st.draw){ st.draw.cards.splice(i,1); st.draw.winner=fix(st.draw.winner); }
    if(st.host===ME && st.players.length) st.host=st.players[0].id;
    if(st.players.length<2){
      if(st.phase==='play'){ st.caller=null; endRound(st); }
      else if(st.phase==='peek'){ st.phase='lobby'; st.players.forEach(q=>{q.slots=[];}); }
    } else if(st.phase==='peek' && st.players.every(q=>q.ready)){ st.phase='play'; }
  },
  start(st){
    if(st.host!==ME) return 'Seul l’hôte peut lancer la manche.';
    if(!['lobby','reveal','over'].includes(st.phase)) return;
    if(st.players.length<2) return 'Il faut au moins 2 joueurs.';
    if(st.phase==='over'){ st.players.forEach(p=>{p.total=0;p.last=0;}); st.round=0; }
    deal(st);
  },
  ready(st){
    const i=mi(st); if(st.phase!=='peek'||i<0) return;
    st.players[i].ready=true;
    if(st.players.every(p=>p.ready)){ st.phase='play'; log(st,`${st.players[st.turn].name} commence`); }
  },
  forceStart(st){
    if(st.host!==ME||st.phase!=='peek') return;
    st.players.forEach(p=>p.ready=true); st.phase='play'; log(st,`${st.players[st.turn].name} commence`);
  },
  draw(st){
    const t=needTurn(st,['start']); if(t.err) return t.err;
    const c=drawCard(st); if(!c) return 'Plus aucune carte à piocher.';
    st.held=c; st.heldFrom='deck'; st.step='drawn';
  },
  take(st){
    const t=needTurn(st,['start']); if(t.err) return t.err;
    if(!st.discard.length) return 'La défausse est vide.';
    st.held=st.discard.pop(); st.heldFrom='discard'; st.step='fromDiscard';
    log(st,`${t.p.name} prend ${cname(st.held)} dans la défausse`);
  },
  swap(st,{s}){
    const t=needTurn(st,['drawn','fromDiscard']); if(t.err) return t.err;
    const old=t.p.slots[s];
    if(!old){
      if(count(t.p)>0 || s>=t.p.slots.length) return 'Choisissez une de vos cartes.';
      t.p.slots[s]=st.held; log(st,`${t.p.name} repose une carte`); endTurn(st); return;
    }
    t.p.slots[s]=st.held; st.discard.push(old);
    log(st,`${t.p.name} échange une carte et défausse ${cname(old)}`);
    endTurn(st);
  },
  discardHeld(st){
    const t=needTurn(st,['drawn']); if(t.err) return t.err;
    const c=st.held; st.discard.push(c); st.held=null; st.heldFrom=null;
    log(st,`${t.p.name} défausse ${cname(c)}`);
    const pw=powerAvail(st,c,t.i);
    if(pw){ st.step='power'; st.power=pw; } else endTurn(st);
  },
  look(st,{p,s,kind}){
    const t=needTurn(st,['power']); if(t.err) return t.err;
    if(st.power!==kind) return;
    if(kind==='own' && p!==t.i) return;
    if(kind==='opp' && (p===t.i||p===st.caller)) return;
    if(!st.players[p]||!st.players[p].slots[s]) return 'Cette carte n’existe plus.';
    log(st, kind==='own'?`${t.p.name} regarde une de ses cartes`:`${t.p.name} regarde une carte de ${st.players[p].name}`);
    st.fx={ids:[st.players[p].slots[s].id],seq:(st.seq||0)+1};
    endTurn(st);
  },
  nineLook(st,{s,p,u}){
    const t=needTurn(st,['power']); if(t.err) return t.err;
    if(st.power!=='nine'||st.nineLook) return;
    const o=st.players[p]; if(!o||p===t.i||p===st.caller||!o.slots[u]) return 'Carte non valide.';
    if(!t.p.slots[s]) return 'Cette carte n’existe plus.';
    st.nineLook={s,p,u,ids:[t.p.slots[s].id,o.slots[u].id]}; st.fx={ids:st.nineLook.ids,seq:(st.seq||0)+1};
    log(st,`${t.p.name} regarde une de ses cartes et une carte de ${o.name}`);
  },
  nine(st){
    const t=needTurn(st,['power']); if(t.err) return t.err;
    if(st.power!=='nine'||!st.nineLook) return;
    const {s,p,u,ids}=st.nineLook, o=st.players[p];
    const a=t.p.slots[s], b=o&&o.slots[u];
    if(!a||!b||a.id!==ids[0]||b.id!==ids[1]){ log(st,`Échange impossible : une des cartes a été collée`); endTurn(st); return; }
    [t.p.slots[s],o.slots[u]]=[o.slots[u],t.p.slots[s]]; log(st,`${t.p.name} échange sa carte avec celle de ${o.name}`);
    endTurn(st);
  },
  ten(st,{p,u,q,v}){
    const t=needTurn(st,['power']); if(t.err) return t.err;
    if(st.power!=='ten') return;
    const a=st.players[p], b=st.players[q];
    if(!a||!b||p===q||p===t.i||q===t.i||p===st.caller||q===st.caller) return 'Choisissez deux adversaires différents.';
    if(!a.slots[u]||!b.slots[v]) return 'Une des cartes n’existe plus.';
    [a.slots[u],b.slots[v]]=[b.slots[v],a.slots[u]];
    log(st,`${t.p.name} échange une carte de ${a.name} avec une carte de ${b.name}`); endTurn(st);
  },
  skipPower(st){
    const t=needTurn(st,['power']); if(t.err) return t.err;
    if(st.power==='nine'&&st.nineLook) return 'Vous avez regardé les deux cartes : l’échange est obligatoire.';
    log(st,`${t.p.name} n’utilise pas son pouvoir`); endTurn(st);
  },
  tamalou(st){
    const t=needTurn(st,['start']); if(t.err) return t.err;
    st.caller=t.i; log(st,`${t.p.name} annonce TamTam !`); endRound(st);
  },
  coller(st,{p,s,rank}){
    const i=mi(st); if(i<0) return 'Vous ne jouez pas dans cette partie.';
    if(st.phase!=='play') return 'On ne peut pas coller maintenant.';
    if(st.caller===i) return 'Votre jeu est gelé après votre Tamalou.';
    if(st.caller===p) return 'Le jeu de celui qui a annoncé Tamalou est gelé.';
    if((st.gives||[]).some(g=>g.from===i)) return 'Donnez d’abord votre carte.';
    const tp=top(st); if(!tp) return 'La défausse est vide.';
    if(tp.r!==rank) return 'Trop tard : la défausse a changé.';
    const me=st.players[i], o=st.players[p], c=o&&o.slots[s];
    if(!c) return 'Trop tard : cette carte est déjà partie.';
    if(c.r===rank){
      o.slots[s]=null; st.discard.push(c);
      if(p===i) log(st,`${me.name} colle ${cname(c)}`);
      else { log(st,`${me.name} colle ${cname(c)} de ${o.name}`); if(count(me)>0) st.gives.push({from:i,to:p,s}); }
      checkEmpty(st,p);
    } else {
      const pen=drawCard(st); if(pen) me.slots.push(pen);
      log(st,`${me.name} rate son collage (c’était ${cname(c)}) : carte de pénalité`);
    }
  },
  give(st,{s}){
    const i=mi(st); const k=(st.gives||[]).findIndex(g=>g.from===i); if(k<0) return;
    const g=st.gives[k], me=st.players[i], c=me.slots[s];
    if(!c) return 'Choisissez une de vos cartes.';
    me.slots[s]=null; const to=st.players[g.to];
    if(to.slots[g.s]==null) to.slots[g.s]=c; else to.slots.push(c);
    st.gives.splice(k,1); log(st,`${me.name} donne une carte à ${to.name}`);
    checkEmpty(st,i);
  },
  skipTurn(st){
    if(st.host!==ME||st.phase!=='play') return;
    const p=st.players[st.turn];
    if(st.held) st.discard.push(st.held);
    log(st,`L’hôte passe le tour de ${p.name}`); endTurn(st);
  }
};

/* ---------- Data layer (Supabase) ---------- */
const TABLE='tamalou_games';
function cfgOk(){ const c=window.TAMALOU_CONFIG||{}; return !!(c.supabaseUrl&&c.supabaseAnonKey&&!/COLLEZ/i.test(c.supabaseAnonKey)&&!/COLLEZ|VOTRE/i.test(c.supabaseUrl)); }
async function fetchGame(code){ const {data,error}=await SB.from(TABLE).select('state,version').eq('code',code).maybeSingle(); if(error) throw error; return data; }
function applyRow(row){ if(!row||!row.state) return false; if(row.version<GV) return false; GV=row.version; G=row.state; return true; }
async function mutate(fn){
  if(!CODE||!SB) return;
  for(let n=0;n<10;n++){
    let row; try{ row=await fetchGame(CODE); }catch(e){ toast('Connexion instable, réessayez.'); return; }
    if(!row){ toast('Cette partie n’existe plus.'); return; }
    const st=JSON.parse(JSON.stringify(row.state));
    const res=fn(st);
    if(typeof res==='string'){ toast(res); return; }
    st.seq=(st.seq||0)+1;
    const {data,error}=await SB.from(TABLE).update({state:st,version:row.version+1,updated_at:new Date().toISOString()}).eq('code',CODE).eq('version',row.version).select('version');
    if(error){ toast('Connexion instable, réessayez.'); return; }
    if(data&&data.length){ applyRow({state:st,version:row.version+1}); render(); return true; }
    await sleep(80+Math.random()*220);
  }
  toast('La table est très occupée, réessayez.');
}
let busy=false;
async function act(name,args){ if(busy) return; busy=true; try{ return await mutate(st=>A[name](st,args||{})); } finally{ busy=false; } }
async function checkConn(){
  if(!SB){ ui.conn={ok:false,msg:'config.js incomplet'}; return; }
  try{
    const {error}=await SB.from(TABLE).select('code',{count:'exact',head:true});
    if(error) throw error;
    ui.conn={ok:true};
  }catch(e){
    const m=(e&&e.message)||String(e);
    ui.conn={ok:false,msg:/relation|does not exist|schema cache|404/i.test(m)?'La table n’existe pas encore : exécutez tamalou.sql dans Supabase (SQL Editor).':/Invalid API key|JWT|401/i.test(m)?'Clé anon incorrecte dans config.js.':'Connexion à Supabase impossible : '+m};
  }
  render();
}
function fail(msg){ ui.err=msg; toast(msg); render(); }
function closeChannel(){ if(chan){ try{ SB.removeChannel(chan); }catch(e){} chan=null; } if(pollT){ clearInterval(pollT); pollT=null; } }
async function openGame(code,quiet){
  closeChannel(); CODE=code; GV=0; G=null; ls('tamalou-code',code);
  try{ const row=await fetchGame(code); if(!row){ if(!quiet) fail('Aucune partie avec ce code.'); closeGame(); return false; } applyRow(row); }
  catch(e){ fail('Connexion impossible : '+((e&&e.message)||'réseau')); closeGame(); return false; }
  render();
  chan=SB.channel('tamalou-'+code)
    .on('postgres_changes',{event:'*',schema:'public',table:TABLE,filter:'code=eq.'+code},payload=>{
      if(payload.eventType==='DELETE'){ closeGame(); toast('La table a été fermée.'); return; }
      if(applyRow(payload.new)) render();
    }).subscribe();
  pollT=setInterval(async()=>{ if(!CODE) return; try{ const row=await fetchGame(CODE); const v0=GV; if(row&&applyRow(row)&&GV!==v0) render(); }catch(e){} },4000);
  return true;
}
function closeGame(){ closeChannel(); CODE=null; G=null; GV=0; ls('tamalou-code',null); ui.mode=null; render(); }
function newState(c,name){
  return {code:c,host:ME,phase:'lobby',players:[{id:ME,name,slots:[],ready:false,total:0,last:0,hand:null}],
    deck:[],discard:[],turn:0,step:'start',held:null,heldFrom:null,power:null,caller:null,gives:[],
    log:[{t:`${name} ouvre la table`,ts:Date.now()}],round:0,seq:0,limit:100,nextStarter:null,draw:null,created:Date.now()};
}
async function createGame(){
  const name=ui.name.trim(); if(!name) return fail('Entrez votre prénom.');
  ui.err=''; ls('tamalou-name',name);
  const L='ABCDEFGHJKLMNPQRSTUVWXYZ';
  for(let n=0;n<6;n++){
    const c=Array.from({length:4},()=>L[Math.floor(Math.random()*L.length)]).join('');
    const {error}=await SB.from(TABLE).insert({code:c,state:newState(c,name),version:1});
    if(!error){ openGame(c); return; }
    if(error.code!=='23505'){ return fail('Impossible de créer la partie : '+(error.message||'erreur réseau')+(/relation|schema cache/i.test(error.message||'')?' → le script tamalou.sql n’a pas été exécuté dans Supabase.':'')); }
  }
  toast('Réessayez dans un instant.');
}
async function joinGame(){
  const name=ui.name.trim(); const code=ui.code.trim().toUpperCase();
  if(!name) return fail('Entrez votre prénom.');
  if(code.length!==4) return fail('Le code fait 4 lettres.');
  ui.err=''; ls('tamalou-name',name);
  if(!(await openGame(code))) return;
  if(G.players.some(p=>p.id===ME)) return;
  if(G.phase!=='lobby') return toast('Partie déjà commencée : vous regardez.');
  await act('join',{name});
}

/* ---------- Rendering ---------- */
function face(c){
  if(c.r==='JK') return `<span class="f joker"><span class="ix">−1<i>★</i></span><span class="pip art">${ART.JK}</span><span class="ix rot">−1<i>★</i></span></span>`;
  const red=c.s==='h'||c.s==='d', l=LABEL[c.r]||c.r, su=SUIT[c.s];
  const art=ART[c.r];
  return `<span class="f${red?' red':''}"><span class="ix">${l}<i>${su}</i></span><span class="pip${art?' art':''}">${art||su}</span><span class="ix rot">${l}<i>${su}</i></span></span>`;
}
function cardHTML(c,size,up,extra){ return `<span class="slot ${size}${extra||''}">${up?face(c):'<span class="back"></span>'}</span>`; }
function visible(st,p,s){
  const c=st.players[p].slots[s];
  if(st.phase==='reveal'||st.phase==='over') return true;
  if(ui.reveal && ui.reveal.ids.includes(c.id) && Date.now()<ui.reveal.until) return true;
  if(st.step==='power'&&st.power==='nine'&&st.nineLook&&st.turn===mi(st)&&st.nineLook.ids.includes(c.id)) return true;
  if(st.phase==='peek' && p===mi(st) && (s===2||s===3)) return true;
  return false;
}
function canColler(st){
  const i=mi(st);
  return i>=0 && st.phase==='play' && st.discard.length>0 && !(st.gives||[]).some(g=>g.from===i);
}
/* Primary action a tap on a card triggers (power targets, swap, give). Anything else is a collage attempt. */
function interaction(st){
  const i=mi(st); if(i<0||!st) return null;
  const has=(p,s)=>!!(st.players[p]&&st.players[p].slots[s]);
  if((st.gives||[]).some(g=>g.from===i)) return {kind:'give',pred:(p,s)=>p===i&&has(p,s)};
  if(st.phase!=='play'||st.turn!==i) return null;
  if(st.step==='drawn'||st.step==='fromDiscard'){
    const none=count(st.players[i])===0;
    return {kind:'swap',pred:(p,s)=>p===i&&(has(p,s)||(none&&s<st.players[i].slots.length))};
  }
  if(st.step==='power'){
    const opp=(p,s)=>p!==i&&has(p,s);
    if(st.power==='own') return {kind:'own',pred:(p,s)=>p===i&&has(p,s)};
    if(st.power==='opp') return {kind:'opp',pred:opp};
    if(st.power==='nine'){
      if(st.nineLook) return null;
      if(ui.sel==null) return {kind:'nine1',pred:(p,s)=>p===i&&has(p,s)};
      return {kind:'nine2',pred:opp};
    }
    if(st.power==='ten'){
      if(!ui.pick) return {kind:'ten1',pred:opp};
      return {kind:'ten2',pred:(p,s)=>opp(p,s)&&p!==ui.pick.p};
    }
  }
  return null;
}
function slotHTML(st,p,s,size,it){
  const c=st.players[p].slots[s];
  const pick=!!(it&&it.pred(p,s));
  if(!c) return pick?`<button class="slot ${size} empty pick" data-p="${p}" data-s="${s}" aria-label="Emplacement vide"></button>`:`<span class="slot ${size} empty"></span>`;
  const up=visible(st,p,s);
  const sel=((ui.sel!=null&&p===mi(st)&&s===ui.sel)||(ui.pick&&ui.pick.p===p&&ui.pick.u===s))?' sel':'';
  const seen=(up&&((ui.reveal&&ui.reveal.ids.includes(c.id))||(st.nineLook&&st.nineLook.ids.includes(c.id)&&st.turn===mi(st))))?' seen':'';
  const tappable=pick||canColler(st);
  const cls=`slot ${size}${pick?' pick':''}${sel}${seen}`;
  const inner=up?face(c):'<span class="back"></span>';
  return tappable?`<button class="${cls}" data-cid="${c.id}" data-p="${p}" data-s="${s}" aria-label="Carte ${s+1} de ${esc(st.players[p].name)}">${inner}</button>`:`<span class="${cls}" data-cid="${c.id}">${inner}</span>`;
}

  if(!booted){ app.innerHTML='<div class="page"><div class="hero"><h1>TamTamDZ</h1><p>Ouverture de la table…</p></div></div>'; return; }
  if(!CODE||!G){ renderHome(); return; }
  if(G.phase==='lobby') renderLobby(); else if(G.phase==='reveal'||G.phase==='over') renderScores(); else renderTable();
}

function renderTable(){
  const st=G, i=mi(st), it=interaction(st), n=st.players.length;
  const order=[]; for(let k=1;k<=n;k++){ const idx=((i<0?0:i)+k)%n; if(idx!==i) order.push(idx); }
  if(i<0){ order.length=0; for(let k=0;k<n;k++) order.push(k); }
  const tp=top(st), me=i>=0?st.players[i]:null, cur=st.players[st.turn];
  const myTurn=st.phase==='play'&&st.turn===i;
  const seats=order.map(k=>{ const p=st.players[k]; const nb=count(p);
    const sub=st.phase==='peek'?(p.ready?'prêt':'mémorise…'):`${nb} carte${nb>1?'s':''} · ${p.total||0} pts`;
    return `<div class="seat${st.turn===k&&st.phase==='play'?' turn':''}">
    <div class="head"><span class="av">${esc(p.name.slice(0,1).toUpperCase())}</span><span class="nm">${esc(p.name)}</span></div>
    <div class="sub">${sub}</div>
    ${p.slots.length>4?`<div class="extra">${p.slots.map((_,s)=>s>=4?slotHTML(st,k,s,'mini',it):'').join('')}</div>`:''}
    <div class="grid">${p.slots.slice(0,4).map((_,s)=>slotHTML(st,k,s,'mini',it)).join('')}</div></div>`; }).join('');
  // piles
  const canDraw=myTurn&&st.step==='start';
  const canTake=myTurn&&st.step==='start'&&!!tp&&count(me)>0;
  const canDiscard=myTurn&&st.step==='drawn';
  const deckHTML=`<button class="slot mid pilebtn${canDraw?' pick':''}" data-pile="deck" data-a="draw" ${canDraw?'':'disabled'} aria-label="Pioche"><span class="back"></span><span class="count">${st.deck.length}</span></button>`;
  const discHTML=tp?`<button class="slot mid pilebtn${(canTake||canDiscard)?' pick':''}" data-cid="${tp.id}" data-a="${canDiscard?'discardHeld':'take'}" ${(canTake||canDiscard)?'':'disabled'} aria-label="Défausse">${face(tp)}</button>`:`<span class="slot mid empty"></span>`;
  let heldHTML='';
  if(st.held){
    const up=myTurn||st.heldFrom==='discard';
    heldHTML=`<div class="pile"><span class="slot mid held" data-cid="${st.held.id}">${up?face(st.held):'<span class="back"></span>'}</span><span class="lbl">${myTurn?'<b>Votre carte</b>':'En main : '+esc(cur.name)}</span></div>`;
  }
  // status, chips, banner
  let status='', chips='', banner='';
  const give=(st.gives||[]).find(g=>g.from===i);
  if(give) banner=`<div class="banner give">Touchez une de vos cartes : elle ira à ${esc(st.players[give.to].name)}.</div>`;
  const collerHint=canColler(st)&&tp?` <span class="dim">Touchez une carte pour la coller sur ${cname(tp)}.</span>`:'';
  if(st.phase==='peek'){
    if(i<0) status='Les joueurs mémorisent leurs cartes.';
    else if(!me.ready){ status='Mémorisez vos <b>deux cartes du bas</b>.'; chips=`<button class="chip main" data-a="ready">C’est mémorisé</button>`; }
    else status='En attente des autres joueurs…';
    if(st.host===ME && st.players.some(p=>!p.ready)) chips+=`<button class="chip" data-a="forceStart">Commencer sans attendre</button>`;
  } else if(i<0){
    status=`Vous regardez la partie. Au tour de <b>${esc(cur.name)}</b>.`;
  } else if(myTurn){
    if(st.step==='start'){
      status='<b>À vous.</b> Touchez la pioche ou la défausse.'+collerHint;
      chips=`<button class="chip call" data-a="tamalou">TamTam !</button>`;
    } else if(st.step==='drawn'){
      const pw=powerAvail(st,st.held,i);
      status=`Touchez <b>une de vos cartes</b> pour la remplacer par ${cname(st.held)}, ou <b>la défausse</b> pour le défausser${pw?` et pouvoir ${POWER_TXT[pw]}`:''}.`;
    } else if(st.step==='fromDiscard'){
      status=`Touchez <b>la carte à remplacer</b> par ${cname(st.held)}.`;
    } else if(st.step==='power'){
      const k=st.power;
      if(k==='own') status='Pouvoir du 7 : touchez <b>une de vos cartes</b> pour la regarder.';
      if(k==='opp') status='Pouvoir du 8 : touchez <b>une carte adverse</b> pour la regarder.';
      if(k==='nine'){
        if(st.nineLook){ status='Mémorisez ces deux cartes, puis échangez-les.'; chips=`<button class="chip main" data-a="nine">Échanger</button>`; }
        else if(ui.sel==null) status='Pouvoir du 9 : touchez <b>une de vos cartes</b>…';
        else status='…puis <b>une carte adverse</b>. Vous verrez les deux, et devrez les échanger.';
      }
      if(k==='ten') status=!ui.pick?'Pouvoir du 10 : touchez <b>une carte d’un adversaire</b>…':'…puis <b>une carte d’un autre adversaire</b>. Elles seront échangées sans être vues.';
      if(!(k==='nine'&&st.nineLook)) chips+=`<button class="chip" data-a="skipPower">Ne pas utiliser le pouvoir</button>`;
    }
  } else {
    const what=st.step==='drawn'?' a pioché une carte':st.step==='fromDiscard'?` a pris ${cname(st.held)}`:st.step==='power'?` utilise le pouvoir du ${ {own:'7',opp:'8',nine:'9',ten:'10'}[st.power] }`:' joue';
    status=`<b>${esc(cur.name)}</b>${what}.`+collerHint;
  }

  const mine=me?`<div class="hand${myTurn?' myturn':''}">
      ${me.slots.length>4?`<div class="extra">${me.slots.map((_,s)=>s>=4?slotHTML(st,i,s,'big',it):'').join('')}</div>`:''}
      <div class="grid">${me.slots.slice(0,4).map((_,s)=>slotHTML(st,i,s,'big',it)).join('')}</div>
      <div class="who">${esc(me.name)} · ${me.total||0} pts</div></div>`:'';
  const last=(st.log||[])[0];
  app.innerHTML=`<div class="screen">
  <div class="bar"><span class="brand">TamTamDZ</span><span class="meta">${esc(st.code)} · manche ${st.round}</span><span class="links"><button class="link" data-a="mute">${muted?'🔇':'🔊'}</button><button class="link" data-a="rules">Règles</button>${i>=0?`<button class="link" data-a="leaveGame">Quitter</button>`:''}</span></div>
  ${ui.rules?`<div class="panel">${rulesHTML()}<button class="btn" data-a="rules">Fermer</button></div>`:''}
  ${st.phase==='peek'&&st.draw?`<div class="drawrow"><span class="note">Tirage :</span>${st.players.map((p,k)=>st.draw.cards[k]?`<span class="drawc${st.draw.winner===k?' win':''}"><span class="slot mini">${face(st.draw.cards[k])}</span>${esc(p.name.slice(0,8))}</span>`:'').join('')}<span class="note"><b>${esc(st.players[st.draw.winner].name)}</b> commence</span></div>`:(st.phase==='peek'?`<div class="drawrow"><span class="note"><b>${esc(st.players[st.turn].name)}</b> a gagné la manche et commence</span></div>`:'')}
  <div class="opps">${seats}</div>
  <div class="center">
    <div class="pile">${deckHTML}<span class="lbl">Pioche</span></div>
    <div class="pile">${discHTML}<span class="lbl">Défausse</span></div>
    ${heldHTML}
  </div>
  ${banner}
  <div class="status"><span>${status}</span></div>
  <div class="chips">${chips}</div>
  <div class="dock">
    ${mine}
    <div class="log">${last?esc(last.t):''}${last&&hostbar?' · ':''}${hostbar}</div>
  </div></div>`;
  if(st.phase==='peek'&&st.draw) runDrawOverlay(st);
}
function showOrder(st){
  const c=st.caller, idx=st.players.map((_,k)=>k);
  const others=idx.filter(k=>k!==c).sort((x,y)=>(st.players[y].hand||0)-(st.players[x].hand||0));
  return c!=null?[c,...others]:others;
}

  runShowdown(st);
}
let show={seq:-1,timers:[]};
function runShowdown(st){
  show.timers.forEach(clearTimeout); show.timers=[]; show.seq=st.seq;
  const root=document.querySelector('.showdown'); if(!root) return;
  const order=showOrder(st), c=st.caller;
  const rowEl=k=>root.querySelector(`.srow[data-k="${k}"]`);
  let t=400; const at=(ms,fn)=>show.timers.push(setTimeout(fn,ms));
  if(c!=null) at(100,()=>SFX.tam());
  order.forEach(k=>{
    const p=st.players[k], cards=p.slots.filter(Boolean);
    at(t,()=>{ const r=rowEl(k); if(r){ r.classList.add('active'); r.scrollIntoView({block:'nearest',behavior:'smooth'}); } });
    t+=350;
    let sum=0;
    cards.forEach((cd,j)=>{ const v=val(cd); at(t,()=>{ const r=rowEl(k); if(!r) return; const el=r.querySelectorAll('.slot.down')[0]; if(el){ el.classList.remove('down'); el.classList.add('up'); } sum+=v; r.querySelector('.hand').textContent=sum; SFX.flip(); }); t+=520; });
    t+=500;
    at(t,()=>{ const r=rowEl(k); if(r){ r.classList.remove('active'); r.classList.add('done'); } });
    t+=250;
  });
  // verdict
  at(t,()=>{
    const v=root.querySelector('.verdict'); if(!v) return; v.classList.remove('hidden');
    if(c==null){ v.textContent='Fin de la manche'; v.classList.add('ok'); SFX.win(); return; }
    const name=esc(st.players[c].name);
    if(st.callerWon){ v.innerHTML=`TamTam réussi ! <b>${name}</b> marque 0 point`; v.classList.add('ok'); SFX.win(); }
    else { v.innerHTML=`TamTam raté… <b>${name}</b> prend <b>${st.players[c].last}</b> points, les autres 0`; v.classList.add('ko'); SFX.lose(); }
  });
  t+=900;
  // round scores + totals
  at(t,()=>{ root.querySelectorAll('.srow .plus, .srow .eq, .srow .tot, .tag.go').forEach(e=>e.classList.remove('hidden')); countUp(root); });
  t+=1500;
  at(t,()=>finishShowdown(true));
}
function finishShowdown(soft){
  const root=document.querySelector('.showdown'); if(!root) return;
  if(!soft){ show.timers.forEach(clearTimeout); show.timers=[];
    root.querySelectorAll('.srow').forEach(r=>{ r.classList.remove('active'); r.classList.add('done'); let sum=0; r.querySelectorAll('.slot').forEach(el=>{ el.classList.remove('down'); el.classList.add('up'); sum+=+el.dataset.val; }); r.querySelector('.hand').textContent=sum; });
    root.querySelectorAll('.hidden').forEach(e=>{ if(!e.closest('.after')&&!e.classList.contains('verdict')) e.classList.remove('hidden'); });
    root.querySelectorAll('.tot').forEach(el=>{ el.textContent=el.dataset.to; el.classList.add('done'); });
    const v=root.querySelector('.verdict'); const st=G; if(v&&st){ v.classList.remove('hidden'); if(st.caller==null){ v.textContent='Fin de la manche'; v.classList.add('ok'); } else if(st.callerWon){ v.innerHTML=`TamTam réussi ! <b>${esc(st.players[st.caller].name)}</b> marque 0 point`; v.classList.add('ok'); } else { v.innerHTML=`TamTam raté… <b>${esc(st.players[st.caller].name)}</b> prend <b>${st.players[st.caller].last}</b> points, les autres 0`; v.classList.add('ko'); } }
  }
  root.querySelector('.after').classList.remove('hidden');
  const sk=root.querySelector('[data-a="skipShow"]'); if(sk) sk.remove();
}
function countUp(root){
  const els=[...root.querySelectorAll('.num.tot')];
  const t0=performance.now(), dur=1300; let lastTick=0;
  const tick=now=>{ const k=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-k,3); let go=false;
    els.forEach(el=>{ if(!el.isConnected) return; const a=+el.dataset.from, b=+el.dataset.to; el.textContent=Math.round(a+(b-a)*e); if(k<1) go=true; else el.classList.add('done'); });
    if(now-lastTick>90&&k<1){ lastTick=now; SFX.tick(); }
    if(go) requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
}

/* ---------- Sounds (synthesised, no files) ---------- */
let AC=null, muted=ls('tamtam-mute')==='1';
function ac(){ if(muted) return null; try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); return AC; }catch(e){ return null; } }
function tone(f,dur,type,vol,when,slide){ const a=ac(); if(!a) return; const o=a.createOscillator(), g=a.createGain(); const t=a.currentTime+(when||0); o.type=type||'sine'; o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+dur); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||.12,t+.012); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+.03); }
const SFX={
  flip:()=>tone(880,.09,'triangle',.11,0,440),
  deal:()=>tone(320,.14,'sawtooth',.05,0,110),
  tick:()=>tone(1500,.03,'square',.035),
  win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.28,'triangle',.13,i*.11)),
  lose:()=>{ tone(320,.35,'sawtooth',.1,0,190); tone(230,.55,'sawtooth',.09,.3,120); },
  tam:()=>{ tone(660,.1,'square',.08); tone(880,.16,'square',.08,.1); }
};
document.addEventListener('pointerdown',()=>{ if(!muted) ac(); },{passive:true});

/* ---------- Opening draw : the table master deals one card per player ---------- */
function runDrawOverlay(st){
  if(!st.draw||ui.drawShown===st.round) return; ui.drawShown=st.round;
  const ov=document.createElement('div'); ov.className='overlay';
  ov.innerHTML=`<div class="ovtitle">Qui commence ?</div><p class="note">Le maître de table distribue une carte à chacun. La plus petite carte commence.</p><div class="ovcards"></div><div class="ovmsg"></div><button class="chip" data-ov="skip">Passer</button>`;
  document.body.appendChild(ov);
  const wrap=ov.querySelector('.ovcards'); const timers=[];
  const close=()=>{ timers.forEach(clearTimeout); ov.classList.add('out'); setTimeout(()=>ov.remove(),420); };
  ov.addEventListener('click',e=>{ if(e.target.dataset.ov) close(); });
  let t=500;
  st.players.forEach((p,k)=>{ const c=st.draw.cards[k]; if(!c) return;
    timers.push(setTimeout(()=>{ SFX.deal(); const el=document.createElement('div'); el.className='ovcard'; el.dataset.k=k; el.innerHTML=`<span class="slot big deal">${face(c)}</span><span class="n">${esc(p.name)}</span><span class="v">${val(c)} pt${Math.abs(val(c))>1?'s':''}</span>`; wrap.appendChild(el); },t)); t+=850; });
  timers.push(setTimeout(()=>{ const w=st.draw.winner; const el=wrap.querySelector(`.ovcard[data-k="${w}"]`); if(el) el.classList.add('win'); ov.querySelector('.ovmsg').innerHTML=`<b>${esc(st.players[w].name)}</b> commence`; SFX.win(); },t+300));
  timers.push(setTimeout(close,t+2900));
}
/* ---------- Events ---------- */
function showReveal(cards,ms){ const r={ids:cards.map(c=>c.id),until:Date.now()+ms}; ui.reveal=r; if(ms<1e8) setTimeout(()=>{ if(ui.reveal===r){ ui.reveal=null; render(); } },ms+20); }
function onSlot(p,s){
  const st=G, it=interaction(st);
  const c=st.players[p].slots[s];
  if(it&&it.pred(p,s)){
    switch(it.kind){
      case 'give': act('give',{s}); return;
      case 'swap': act('swap',{s}); return;
      case 'own': case 'opp': showReveal([c],3500); render(); act('look',{p,s,kind:it.kind}); return;
      case 'nine1': ui.sel=s; render(); return;
      case 'nine2': { const own=ui.sel; ui.sel=null; act('nineLook',{s:own,p,u:s}); return; }
      case 'ten1': ui.pick={p,u:s}; render(); return;
      case 'ten2': { const k=ui.pick; ui.pick=null; act('ten',{p:k.p,u:k.u,q:p,v:s}); return; }
    }
  }
  const i=mi(st);
  if(st.phase==='play'&&st.turn===i&&st.step!=='start'){ toast(st.step==='power'?'Pouvoir en cours : touchez une carte en vert, ou passez le pouvoir.':'Terminez d’abord votre coup (échanger ou défausser).'); return; }
  if(c&&canColler(st)){ const tp=top(st); if(tp) act('coller',{p,s,rank:tp.r}); }
}
app.addEventListener('input',e=>{ if(e.target.id==='name') ui.name=e.target.value; if(e.target.id==='code') ui.code=e.target.value.toUpperCase(); });
app.addEventListener('click',e=>{
  const sl=e.target.closest('button.slot[data-p]'); if(sl){ onSlot(+sl.dataset.p,+sl.dataset.s); return; }
  const b=e.target.closest('[data-a]'); if(!b) return;
  const a=b.dataset.a;
  if(a==='create') return createGame();
  if(a==='join') return joinGame();
  if(a==='quit'){ if(G&&G.phase==='lobby') act('leave').then(()=>closeGame()); else closeGame(); return; }
  if(a==='rules'){ ui.rules=!ui.rules; render(); return; }
  if(a==='limit'){ act('setLimit',{limit:+b.dataset.v}); return; }
  if(a==='mute'){ muted=!muted; ls('tamtam-mute',muted?'1':'0'); if(!muted) ac(); render(); return; }
  if(a==='skipShow'){ finishShowdown(false); return; }
  if(a==='leaveGame'){ if(confirm('Quitter la partie ?')){ act('leave').then(()=>closeGame()); } return; }
  if(a==='skipPower'){ ui.sel=null; ui.pick=null; ui.reveal=null; }
  act(a);
});
app.addEventListener('keydown',e=>{ if(e.key==='Enter'){ if(e.target.id==='code') joinGame(); else if(e.target.id==='name') createGame(); } });

/* ---------- Animations : each card that moved flies from its old place to its new one ---------- */
function cardRects(){
  const m=new Map();
  document.querySelectorAll('[data-cid]').forEach(el=>{ const r=el.getBoundingClientRect(); if(r.width>0) m.set(el.dataset.cid,{r,el}); });
  const d=document.querySelector('[data-pile="deck"]');
  return {m, deck:d?d.getBoundingClientRect():null};
}
function fly(from,to){
  const el=to.el, r=to.r;
  const ghost=document.createElement('div');
  ghost.className='fly '+el.className.replace(/\b(pick|sel|seen|pilebtn)\b/g,'');
  ghost.innerHTML=el.innerHTML;
  Object.assign(ghost.style,{position:'fixed',left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px',margin:0,zIndex:50,pointerEvents:'none'});
  document.body.appendChild(ghost);
  el.style.visibility='hidden';
  const anim=ghost.animate([
    {transform:`translate(${from.left-r.left}px,${from.top-r.top}px) scale(${from.width/r.width},${from.height/r.height})`,opacity:.95},
    {transform:'translate(0,0) scale(1,1)',opacity:1}
  ],{duration:820,easing:'cubic-bezier(.2,.75,.2,1)'});
  const done=()=>{ ghost.remove(); el.style.visibility=''; el.classList.add('flash'); sparkle(r); setTimeout(()=>el.classList.remove('flash'),2600); };
  anim.onfinish=done; anim.oncancel=done; setTimeout(()=>{ if(ghost.isConnected) done(); },1200);
}
function animateMoves(before,after){
  const moves=[];
  after.m.forEach((a,id)=>{
    const b=before.m.get(id);
    if(b){ if(Math.abs(b.r.left-a.r.left)>2||Math.abs(b.r.top-a.r.top)>2) moves.push([b.r,a]); }
    else if(before.deck||after.deck) moves.push([before.deck||after.deck,a]);
  });
  if(moves.length>12) return;
  if(moves.length) SFX.deal();
  moves.forEach(([f,a])=>fly(f,a));
}
function flashIds(ids){ ids.forEach(id=>{ const el=document.querySelector(`[data-cid="${id}"]`); if(el){ el.classList.add('lift'); setTimeout(()=>el.classList.remove('lift'),2600); } }); }
function sparkle(r){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cx=r.left+r.width/2, cy=r.top+r.height/2;
  for(let k=0;k<14;k++){
    const sp=document.createElement('span'); sp.className='spark'; sp.textContent=k%3?'✦':'★';
    const ang=Math.random()*Math.PI*2, dist=r.width*(.6+Math.random()*1.1), size=8+Math.random()*10;
    Object.assign(sp.style,{position:'fixed',left:cx+'px',top:cy+'px',fontSize:size+'px',zIndex:60,pointerEvents:'none',color:k%4?'#C8F03C':'#FFFFFF',transform:'translate(-50%,-50%)'});
    document.body.appendChild(sp);
    const a=sp.animate([{transform:'translate(-50%,-50%) scale(.3) rotate(0deg)',opacity:1},{transform:`translate(calc(-50% + ${Math.cos(ang)*dist}px),calc(-50% + ${Math.sin(ang)*dist}px)) scale(1.1) rotate(${180+Math.random()*180}deg)`,opacity:1,offset:.6},{transform:`translate(calc(-50% + ${Math.cos(ang)*dist*1.25}px),calc(-50% + ${Math.sin(ang)*dist*1.25+14}px)) scale(.2) rotate(360deg)`,opacity:0}],{duration:1300+Math.random()*500,easing:'cubic-bezier(.2,.7,.3,1)',delay:Math.random()*120});
    a.onfinish=()=>sp.remove(); setTimeout(()=>sp.remove(),2200);
  }
}

let lastSeq=-1, lastTurnKey='', lastFx=-1;
const _render=render;
render=function(){
  if(G&&CODE&&(G.phase==='reveal'||G.phase==='over')){ const sd=document.querySelector('.showdown'); if(sd&&sd.dataset.seq===String(G.seq)){ const mb=sd.querySelector('[data-a="mute"]'); if(mb) mb.textContent=muted?'🔇':'🔊'; return; } }
  const changed=!!(G&&CODE&&booted&&G.seq!==lastSeq);
  const before=changed&&lastSeq>=0&&document.querySelector('.screen')?cardRects():null;
  if(G){ const key=G.round+':'+G.turn+':'+G.step; if(key!==lastTurnKey){ if(G.step!=='power'){ ui.sel=null; ui.pick=null; if(ui.reveal&&ui.reveal.until>Date.now()+1e7) ui.reveal=null; } lastTurnKey=key; } }
  _render();
  if(changed){
    lastSeq=G.seq;
    if(before && document.querySelector('.screen') && !matchMedia('(prefers-reduced-motion: reduce)').matches) animateMoves(before,cardRects());
    if(G.fx&&G.fx.seq===G.seq&&lastFx!==G.seq){ lastFx=G.seq; flashIds(G.fx.ids||[]); }
  }
};

(async function boot(){
  render();
  ME=ls('tamalou-id')||('p-'+Math.random().toString(36).slice(2,12)); ls('tamalou-id',ME);
  ui.name=ls('tamalou-name')||'';
  if(cfgOk()&&window.supabase){ try{ SB=window.supabase.createClient(window.TAMALOU_CONFIG.supabaseUrl,window.TAMALOU_CONFIG.supabaseAnonKey); }catch(e){ SB=null; } }
  booted=true;
  if('serviceWorker' in navigator){ try{ navigator.serviceWorker.register('sw.js'); }catch(e){} }
  render();
  checkConn();
  const last=ls('tamalou-code'); if(SB&&last){ await openGame(last,true); }
  render();
})();
})();
