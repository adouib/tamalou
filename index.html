<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TamTamDZ</title>
<meta name="theme-color" content="#0B0F1A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TamTamDZ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Fraunces:opsz,wght@9..144,700;9..144,900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0F1A; --bg2:#121829; --surface:#161D30; --surface2:#1E2740; --line:rgba(255,255,255,.09);
  --accent:#C8F03C; --accent-ink:#13200A; --danger:#E5484D; --card:#FFFFFF; --ink:#15181F;
  --felt1:#1B3B33; --felt2:#10241F; --felt-line:rgba(200,240,60,.14); --rail1:#5A3A22; --rail2:#2E1C10; --actbg:#F5F6FA; --actink:#15181F;
  --red:#D93C44; --text:#F5F6FA; --mute:#8E97AD; --back:#243061;
  --ui:"Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --num:"Fraunces", Georgia, "Times New Roman", serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#0B0F1A; --felt1:#1B3B33; --felt2:#10241F; --felt-line:rgba(200,240,60,.14); --rail1:#5A3A22; --rail2:#2E1C10; --actbg:#F5F6FA; --actink:#15181F; } }
:root[data-theme="dark"]{ --bg:#0B0F1A; --felt1:#1B3B33; --felt2:#10241F; --felt-line:rgba(200,240,60,.14); --rail1:#5A3A22; --rail2:#2E1C10; --actbg:#F5F6FA; --actink:#15181F; }
html{ height:100%; min-height:100%; background:var(--bg); scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:inherit; }
body{ margin:0; min-height:100%; font-family:var(--ui); color:var(--text); background:linear-gradient(180deg,var(--bg2) 0%,var(--bg) 60%); -webkit-tap-highlight-color:transparent; }
#app{ max-width:520px; margin:0 auto; min-height:100%; display:flex; flex-direction:column; }
button{ font:inherit; color:inherit; cursor:pointer; }
button:focus-visible, input:focus-visible{ outline:3px solid var(--accent); outline-offset:2px; }
.page{ padding:14px 16px 24px; display:flex; flex-direction:column; gap:14px; }

/* ---------- Home ---------- */
.hero{ text-align:center; padding:28px 0 4px; }
.hero h1{ font-family:var(--num); font-weight:900; font-size:clamp(48px,15vw,76px); line-height:.95; margin:0; letter-spacing:-.02em; }
.hero p{ color:var(--mute); margin:12px auto 0; max-width:32ch; line-height:1.45; font-size:15px; }
.fan{ display:flex; justify-content:center; align-items:flex-end; height:118px; margin:18px 0 0; }
.fan .slot{ margin:0 -16px; transform-origin:50% 120%; }
.fan .slot:nth-child(1){ transform:rotate(-16deg); } .fan .slot:nth-child(2){ transform:rotate(-5deg); }
.fan .slot:nth-child(3){ transform:rotate(5deg); } .fan .slot:nth-child(4){ transform:rotate(16deg); }
.panel{ background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:16px; display:flex; flex-direction:column; gap:10px; }
.panel h2{ font-size:16px; margin:0; font-weight:600; }
label.field{ font-size:13px; color:var(--mute); display:flex; flex-direction:column; gap:6px; }
input{ font:inherit; font-size:17px; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:var(--bg); color:var(--text); width:100%; }
input.code{ text-transform:uppercase; letter-spacing:.3em; font-family:var(--num); font-size:22px; text-align:center; }
.row{ display:flex; gap:10px; }
.btn{ border:1px solid var(--line); border-radius:12px; padding:12px 14px; font-weight:600; font-size:15px; background:var(--surface2); line-height:1.2; }
.btn.main{ background:var(--accent); color:var(--accent-ink); border-color:transparent; }
.btn.call{ background:var(--danger); color:#fff; border-color:transparent; }
.btn.on{ background:var(--text); color:var(--ink); border-color:transparent; }
.btn:disabled{ opacity:.35; cursor:default; }
.btn.wide{ width:100%; }
.link{ background:none; border:0; color:var(--mute); font-size:14px; padding:6px 4px; text-decoration:underline; text-underline-offset:3px; }
.note{ color:var(--mute); font-size:14px; line-height:1.45; margin:0; }
.note.err{ color:#FF8A8F; }
.conn{ margin:0; text-align:center; font-size:13px; color:var(--mute); }
.conn.ok{ color:var(--accent); }
.conn.ko{ color:#FF8A8F; }

/* ---------- Cards ---------- */
.slot{ position:relative; border:0; padding:0; border-radius:8px; aspect-ratio:5/7; display:block; background:none; flex:none; }
.fly.slot{ aspect-ratio:auto; }
.slot.big{ width:var(--bigw); }
.hand{ position:relative; }
.hand .extra{ position:absolute; bottom:calc(100% + 6px); left:0; right:0; display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
.seat .extra{ display:flex; gap:5px; flex-wrap:wrap; padding-top:4px; border-top:1px dashed var(--line); margin-top:1px; max-width:calc(2 * var(--mini) + 5px); }
.slot.mid{ width:var(--midw); }
:root{ --bigw:clamp(58px,17vw,76px); --midw:clamp(46px,12.5vw,56px); --mini:clamp(38px,11vw,46px); --mini-side:clamp(26px,7.6vw,34px); }
.slot.mini{ width:var(--mini); border-radius:5px; }
.slot.empty{ border:1.5px dashed rgba(255,255,255,.16); }
.back{ position:absolute; inset:0; border-radius:inherit; background:var(--back);
  box-shadow:inset 0 0 0 2px #fff, inset 0 0 0 3px var(--back), 0 2px 5px rgba(0,0,0,.4); }
.back::after{ content:""; position:absolute; inset:18% 20%; border-radius:4px; border:1.5px solid rgba(200,240,60,.9); background:repeating-linear-gradient(135deg,transparent 0 5px,rgba(200,240,60,.18) 5px 6px); }
.slot.mini .back{ box-shadow:inset 0 0 0 1.5px #fff, 0 1px 3px rgba(0,0,0,.35); }
.slot.mini .back::after{ inset:18% 20%; border-width:1px; opacity:.7; }
.slot .f{ position:absolute; inset:0; border-radius:inherit; background:var(--card); color:var(--ink); box-shadow:0 2px 5px rgba(0,0,0,.4); font-family:var(--num); font-weight:700; }
.slot .f.red{ color:var(--red); }
.slot .f.joker{ color:#4C6B0A; background:linear-gradient(160deg,#F7FFD6,#E4F79A); }
.slot .f .ix{ position:absolute; top:6%; left:9%; font-size:clamp(14px,4.2vw,19px); line-height:.9; display:flex; flex-direction:column; align-items:center; }
.slot .f .ix i{ font-style:normal; font-size:.72em; margin-top:1px; }
.slot .f .ix.rot{ top:auto; left:auto; bottom:6%; right:9%; transform:rotate(180deg); }
.slot .f .pip{ position:absolute; inset:0; display:grid; place-items:center; font-size:clamp(24px,7vw,34px); }
.slot .f .pip.art{ inset:17% 15% 21% 15%; }
.slot .f .pip.art svg{ width:100%; height:100%; display:block; }
.slot .f.red .pip.art{ color:var(--red); } .slot .f:not(.red):not(.joker) .pip.art{ color:#2E3A8C; }
.slot.mini .f .ix{ top:5%; left:8%; font-size:12px; line-height:.9; }
.slot.mini .f .ix i{ font-size:.7em; }
.slot.mini .f .pip{ font-size:17px; }
.slot.mini .f .pip.art{ inset:20% 16% 22% 16%; }
.slot.mini .f .ix.rot{ display:none; }
.slot.mini .f.joker .ix{ font-size:10px; }
.slot.pick{ cursor:pointer; }
.slot.pick::after{ content:""; position:absolute; inset:-4px; border-radius:11px; border:2.5px solid var(--accent); }
.slot.mini.pick::after{ inset:-3px; border-radius:6px; border-width:2px; }
.slot.sel::after{ border-color:#fff; }
.slot.seen .f{ box-shadow:0 0 0 3px var(--accent), 0 2px 6px rgba(0,0,0,.4); }

/* ---------- Table ---------- */
.screen{ min-height:100dvh; display:flex; flex-direction:column; padding:8px 14px 10px; gap:8px; }
.bar{ display:flex; align-items:center; justify-content:space-between; gap:6px; min-height:32px; min-width:0; }
.bar .brand{ font-family:var(--num); font-weight:900; font-size:clamp(15px,4.6vw,18px); flex:none; }
.bar .meta{ color:var(--mute); font-size:11px; white-space:nowrap; min-width:0; flex:1 1 auto; overflow:hidden; text-overflow:ellipsis; }
.board .bh .x{ margin-left:auto; text-decoration:none; font-size:12px; padding:0 2px; color:var(--mute); }
.link.on{ text-decoration:none; filter:drop-shadow(0 0 4px var(--accent)); }
.bar .links{ display:flex; gap:0; white-space:nowrap; align-items:center; flex:none; } .bar .links .link{ padding:6px 3px; }
.bar .link[data-a="mute"]{ text-decoration:none; font-size:15px; }
.bar .link{ font-size:12px; padding:6px 3px; }
.bar .link[data-a="chat"]{ text-decoration:none; font-size:14px; }
@media (prefers-reduced-motion: no-preference){ .flip{ animation:flip .9s ease both; } @keyframes flip{ 0%{ transform:rotateY(90deg); opacity:0 } 60%{ transform:rotateY(-10deg); opacity:1 } 100%{ transform:none } } }
.board{ align-self:flex-start; width:min(60%,190px); box-sizing:border-box; font-size:11px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:6px 8px; min-width:0; }
.board .bh{ display:flex; align-items:center; gap:4px; font-weight:700; color:var(--mute); font-size:10px; text-transform:uppercase; letter-spacing:.04em; margin-bottom:2px; }
.board .bh span{ font-weight:500; }
.board table{ border-collapse:collapse; width:100%; }
.board td{ height:16px; padding:0 3px; line-height:16px; }
.board td.r{ color:var(--mute); width:1%; padding-left:5px; }
.board td.n{ max-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.board td.p{ text-align:right; font-family:var(--num); white-space:nowrap; width:1%; }
.board td.p.warn{ color:var(--danger); }
.board tr.me td{ font-weight:700; }
.board tr.lead td.r{ color:var(--accent); }
.board tr.turn td:first-child{ box-shadow:inset 3px 0 0 var(--accent); }
.felt{ position:relative; width:100%; height:clamp(470px,62vh,600px); border-radius:999px / 46%; border:12px solid transparent; background:radial-gradient(ellipse at 50% 50%,var(--felt1) 0%,var(--felt2) 100%) padding-box, linear-gradient(145deg,var(--rail1),var(--rail2)) border-box; box-shadow:inset 0 0 0 2px rgba(255,255,255,.06), inset 0 0 60px rgba(0,0,0,.45), 0 10px 28px rgba(0,0,0,.5); min-width:0; box-sizing:border-box; }
.felt::before{ content:"TamTamDZ"; position:absolute; left:50%; top:30%; transform:translate(-50%,-50%); font-weight:800; font-size:22px; letter-spacing:.18em; color:#fff; opacity:.05; pointer-events:none; white-space:nowrap; }
.felt .seat{ --ty:-50%; left:var(--x); top:var(--y); position:absolute; z-index:3; transform:translate(-50%,var(--ty)); background:rgba(11,15,26,.72); backdrop-filter:blur(2px); }
.felt .seat.side-t{ --ty:0%; }
.felt .seat:has(.act){ z-index:4; }
.felt .center{ position:absolute; z-index:2; left:50%; top:72%; transform:translate(-50%,-50%); width:calc(2 * var(--midw) + 12px); flex-wrap:wrap; gap:8px 12px; align-items:flex-end; align-content:center; justify-content:center; padding:0; }
.seat.side-l,.seat.side-t,.seat.side-r{ --mini:var(--mini-side); padding:5px 6px; gap:4px; }
.seat.side-l .nm,.seat.side-t .nm,.seat.side-r .nm{ max-width:56px; font-size:12px; }
.seat.side-l .sub,.seat.side-t .sub,.seat.side-r .sub{ font-size:10px; flex-wrap:wrap; gap:3px; line-height:1.2; }
.seat.side-l .grid,.seat.side-t .grid,.seat.side-r .grid{ gap:3px; }
.felt .seat .nbc{ display:none; }
.seat.side-l .av,.seat.side-t .av,.seat.side-r .av{ width:18px; height:18px; font-size:10px; }
.seat .act{ position:absolute; top:calc(100% + 6px); left:50%; transform:translateX(-50%); width:max-content; max-width:150px; z-index:8; pointer-events:none; background:var(--actbg); color:var(--actink); font-size:10px; line-height:1.2; font-weight:600; padding:3px 6px; border-radius:8px; word-break:break-word; text-align:center; }
.seat .act::before{ content:""; position:absolute; left:50%; margin-left:-4px; top:-4px; border:4px solid transparent; border-top:0; border-bottom-color:var(--actbg); }
.seat{ flex:none; display:flex; flex-direction:column; gap:5px; padding:7px 9px; border-radius:14px; background:var(--surface); border:1px solid var(--line); min-width:0; }
.seat.turn{ border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; }
.seat .head{ display:flex; align-items:center; gap:6px; }
.seat .av{ width:22px; height:22px; border-radius:50%; background:var(--surface2); color:var(--text); font-size:11px; font-weight:800; display:grid; place-items:center; flex:none; }
.seat.turn .av{ background:var(--accent); color:var(--accent-ink); }
.seat .nm{ font-size:13px; font-weight:600; max-width:90px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.seat .sub{ font-size:11px; color:var(--mute); display:flex; gap:6px; align-items:center; }
.tag{ display:inline-block; font-size:10px; font-weight:700; padding:1px 6px; border-radius:99px; background:var(--danger); color:#fff; }
.cards{ display:flex; align-items:flex-start; justify-content:center; gap:5px; }
.hand .cards{ gap:9px; }
.seat .extra.side,.hand .extra.side{ position:static; display:flex; flex-direction:column; gap:0; padding:0; margin:0; border:0; max-width:none; }
.seat .extra.side>*+*{ margin-top:calc(var(--mini) * -1.05); }
.hand .extra.side>*+*{ margin-top:calc(var(--bigw) * -1.05); }
.seat .extra.side{ padding-right:5px; border-right:1px dashed var(--line); }
.hand .extra.side{ padding-left:9px; border-left:1px dashed var(--line); }
.seat .grid{ display:grid; grid-template-columns:repeat(2,var(--mini)); gap:5px; }

.center{ display:flex; justify-content:center; align-items:flex-end; gap:14px; padding:2px 0 0; }
.pile{ display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10px; color:var(--mute); }
.pile .slot{ cursor:default; } .pile button.slot{ border:0; padding:0; }
.pile .lbl b{ color:var(--text); font-weight:600; }
.count{ position:absolute; right:-6px; top:-6px; background:var(--text); color:var(--ink); font-size:11px; font-weight:700; border-radius:99px; padding:1px 6px; z-index:1; }
.status{ text-align:center; font-size:13px; line-height:1.3; color:var(--text); padding:0 4px; min-height:0; display:grid; place-items:center; }
.status span{ display:block; }
.status b{ color:var(--accent); font-weight:600; }
.banner{ text-align:center; background:var(--danger); color:#fff; border-radius:10px; padding:7px 12px; font-weight:600; font-size:13px; }
.banner.give{ background:var(--accent); color:var(--accent-ink); }
.banner.close{ font-size:15px; display:flex; align-items:center; justify-content:center; gap:10px; animation:closePulse .9s ease-in-out infinite; }
.closetimer{ display:inline-grid; place-items:center; min-width:32px; height:32px; border-radius:50%; background:#fff; color:var(--danger); font-family:var(--num); font-weight:900; font-size:19px; flex:none; }
@keyframes closePulse{ 50%{ box-shadow:0 0 0 6px rgba(229,72,77,.35); transform:scale(1.015); } }
.rb{ display:inline-grid; place-items:center; width:18px; height:18px; flex:none; vertical-align:-4px; margin-left:4px; }
.rb svg{ width:100%; height:100%; display:block; }
.rb.crown{ filter:drop-shadow(0 0 4px rgba(232,176,75,.75)); }
.seat .head .rb{ margin-left:0; }
.surpmark{ position:absolute; left:50%; bottom:7%; transform:translateX(-50%); width:22px; height:22px; border-radius:50%; background:var(--accent); color:var(--accent-ink); font-size:13px; line-height:1; display:grid; place-items:center; z-index:3; box-shadow:0 0 12px rgba(200,240,60,.95); animation:twinkle 1.6s ease-in-out infinite; pointer-events:none; }
.slot.mini .surpmark{ width:16px; height:16px; font-size:10px; }
@keyframes twinkle{ 50%{ transform:translateX(-50%) scale(1.25) rotate(20deg); } }
.secret{ margin-top:6px; font-size:12px; color:var(--accent); text-align:center; max-width:46ch; line-height:1.35; }
.chip.surp{ background:linear-gradient(135deg,#C8F03C,#7BC043); color:var(--accent-ink); border-color:transparent; box-shadow:0 0 12px rgba(200,240,60,.6); }
.tiebreak{ text-align:center; font-size:13px; color:var(--mute); padding:0 8px; line-height:1.4; }
.tiebreak b{ color:var(--accent); }
.tiefinal b{ color:var(--accent); }
.chips{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; position:sticky; bottom:calc(10px + env(safe-area-inset-bottom,0px)); z-index:6; filter:drop-shadow(0 4px 12px rgba(0,0,0,.55)); }
.chips:empty{ display:none; }
.chip{ border-radius:999px; padding:8px 14px; font-size:13px; font-weight:600; background:var(--surface2); border:1px solid var(--line); line-height:1.1; }
.chip.main{ background:var(--accent); color:var(--accent-ink); border-color:transparent; }
.chip.call{ background:var(--danger); color:#fff; border-color:transparent; }
.status .dim{ color:var(--mute); }
.slot.pilebtn{ cursor:default; }
.slot.pilebtn.pick{ cursor:pointer; }
.slot.pilebtn:disabled{ opacity:1; }
.fly{ border-radius:8px; }
.fly.mini{ border-radius:4px; }
.slot.flash .back, .slot.flash .f{ box-shadow:0 0 0 3px var(--accent), 0 0 22px rgba(200,240,60,.85); }
.slot.lift{ z-index:5; }
@media (prefers-reduced-motion: no-preference){ .slot.lift{ animation:lift 3s ease both; } @keyframes lift{ 0%{ transform:none } 16%{ transform:translateY(-16px) scale(1.12) } 80%{ transform:translateY(-16px) scale(1.12) } 100%{ transform:none } } }
.slot.lift .back, .slot.lift .f{ box-shadow:0 0 0 3px var(--accent), 0 10px 24px rgba(0,0,0,.6); }
#sheet{ position:fixed; left:0; right:0; bottom:0; z-index:45; display:none; }
#sheet .sheetin{ max-width:520px; margin:0 auto; background:var(--surface); border:1px solid var(--line); border-radius:18px 18px 0 0; padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px)); display:flex; flex-direction:column; gap:10px; box-shadow:0 -10px 30px rgba(0,0,0,.5); }
#sheet .sheethead{ display:flex; justify-content:space-between; align-items:center; }
#sheet .msgs{ max-height:160px; overflow:auto; display:flex; flex-direction:column; gap:4px; font-size:14px; }
#sheet .msg b{ color:var(--accent); font-weight:600; }
#sheet .presets{ display:flex; gap:6px; flex-wrap:wrap; }
#sheet .presets .chip{ padding:6px 10px; font-size:13px; }
#bubble{ position:fixed; top:calc(10px + env(safe-area-inset-top,0px)); left:50%; transform:translate(-50%,-30px); background:var(--text); color:var(--ink); padding:9px 14px; border-radius:16px; font-size:14px; max-width:86vw; z-index:46; opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; box-shadow:0 8px 24px rgba(0,0,0,.45); }
#bubble.on{ opacity:1; transform:translate(-50%,0); }
#bubble b{ color:#5B7A00; font-weight:700; }
.timer{ display:inline-block; margin-left:6px; font-size:12px; color:var(--mute); font-variant-numeric:tabular-nums; }
.timer.hurry{ color:var(--danger); font-weight:700; }
.taunt{ display:block; margin-top:6px; font-size:15px; font-weight:600; opacity:.95; animation:wobble 1.2s ease .3s both; }
@keyframes wobble{ 0%{ transform:rotate(0) } 25%{ transform:rotate(-3deg) scale(1.05) } 50%{ transform:rotate(3deg) scale(1.05) } 75%{ transform:rotate(-2deg) } 100%{ transform:none } }
.slot.mini.flash .back, .slot.mini.flash .f{ box-shadow:0 0 0 2px var(--accent), 0 0 10px rgba(200,240,60,.7); }
@media (prefers-reduced-motion: no-preference){ .slot .back, .slot .f{ transition:box-shadow .3s; } }
.dock{ margin-top:auto; display:flex; flex-direction:column; gap:8px; }
.hand{ display:flex; flex-direction:column; align-items:center; gap:5px; padding:10px 10px 6px; border-radius:18px; background:var(--surface); border:1px solid var(--line); }
.hand .grid{ display:grid; grid-template-columns:repeat(2,auto); gap:9px; }

.hand.myturn{ border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; }
.hand .who{ font-size:12px; color:var(--mute); }
.log{ font-size:12px; color:var(--mute); text-align:center; padding:0 6px; min-height:16px; }
.log .link{ font-size:12px; padding:0; }
.hostbar{ display:flex; justify-content:center; }

/* ---------- Lobby & scores ---------- */
.limit{ display:flex; flex-direction:column; gap:6px; align-items:center; }
.limit .chips{ min-height:0; }
.bigcode{ font-family:var(--num); font-weight:900; font-size:56px; letter-spacing:.18em; text-align:center; margin:2px 0; color:var(--accent); }
.plist{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; }

function rankBadges(st){

/* ---------- Game logic (runs inside a locked read-modify-write) ---------- */
function log(st,t){ st.log=[{t,ts:Date.now()}].concat(st.log||[]).slice(0,30); }
function drawCard(st){

function deal(st){

function drawLots(cands){

async function mutate(fn,actor){
  if(!CODE||!SB) return;

    let row; try{ row=await fetchGame(CODE); }catch(e){ toast('Connexion instable, réessayez.'); return; }
    if(!row){ toast('Cette partie n’existe plus.'); return; }
    const st=JSON.parse(JSON.stringify(row.state));
    const who=actor||ME; ACTOR=who; const l0=(st.log||[])[0]; st.silent=false; let res; try{ res=fn(st); } finally{ ACTOR=ME; }

async function openGame(code,quiet){
  closeChannel(); CODE=code; GV=0; G=null; ls('tamalou-code',code);
  try{ const row=await fetchGame(code); if(!row){ if(!quiet) fail('Aucune partie avec ce code.'); closeGame(); return false; } applyRow(row); if(G&&(G.phase==='peek'||G.phase==='play')){ ui.dealRound=G.round; ui.drawShown=G.round; } }
  catch(e){ fail('Connexion impossible : '+((e&&e.message)||'réseau')); closeGame(); return false; }
  render();
  chan=SB.channel('tamalou-'+code)
    .on('postgres_changes',{event:'*',schema:'public',table:TABLE,filter:'code=eq.'+code},payload=>{
      if(payload.eventType==='DELETE'){ closeGame(); toast('La table a été fermée.'); return; }
      if(applyRow(payload.new)) render();
    }).subscribe();
  pollT=setInterval(async()=>{ if(!CODE) return; try{ const row=await fetchGame(CODE); const v0=GV; if(row&&applyRow(row)&&GV!==v0) render(); }catch(e){} },4000);
  return true;
}

async function createGame(){
  const name=ui.name.trim(); if(!name) return fail('Entrez votre prénom.');

  for(let n=0;n<6;n++){
    const c=Array.from({length:4},()=>L[Math.floor(Math.random()*L.length)]).join('');

function interaction(st){

  if(st.step==='start'&&ui.surp&&canSurprise(st,i)){

    const opp=(p,s)=>p!==i&&has(p,s);
    if(st.power==='own') return {kind:'own',pred:(p,s)=>p===i&&has(p,s)};
    if(st.power==='opp') return {kind:'opp',pred:opp};

let show={seq:-1,timers:[]};
function runShowdown(st){

    else { v.innerHTML=`TamTam raté… <b>${name}</b> prend <b>${st.players[c].last}</b> points, les autres 0<br><span class="taunt">${esc(taunt(st.players[c].name))}</span>`; v.classList.add('ko'); SFX.lose(); emojiRain(['😂','🤭','🫣','💥','🤡'],22); }
    if(st.callerWon) emojiRain(['🎉'],18);

function finishShowdown(soft){
  const root=document.querySelector('.showdown'); if(!root) return;

    root.querySelectorAll('.srow').forEach(r=>{ r.classList.remove('active'); r.classList.add('done'); let sum=0; r.querySelectorAll('.slot').forEach(el=>{ el.classList.remove('down'); el.classList.add('up'); sum+=+el.dataset.val; }); r.querySelector('.hand').textContent=sum; });

    const v=root.querySelector('.verdict'); const st=G; if(v&&st){ v.classList.remove('hidden'); if(st.caller==null){ v.textContent='Fin de la manche'; v.classList.add('ok'); } else if(st.callerWon){ v.innerHTML=`TamTam réussi ! <b>${esc(st.players[st.caller].name)}</b> marque 0 point`; v.classList.add('ok'); } else { v.innerHTML=`TamTam raté… <b>${esc(st.players[st.caller].name)}</b> prend <b>${st.players[st.caller].last}</b> points, les autres 0`; v.classList.add('ko'); } }

function countUp(root){
  const els=[...root.querySelectorAll('.num.tot')];
  const t0=performance.now(), dur=1300; let lastTick=0;
  const tick=now=>{ const k=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-k,3); let go=false;
    els.forEach(el=>{ if(!el.isConnected) return; const a=+el.dataset.from, b=+el.dataset.to; el.textContent=Math.round(a+(b-a)*e); if(k<1) go=true; else el.classList.add('done'); });
    if(now-lastTick>90&&k<1){ lastTick=now; SFX.tick(); }
    if(go) requestAnimationFrame(tick); };

}

/* ---------- Bots : the host's device plays for the machine players ---------- */
const botPlan={}, botTried=new Set(); let botTimer=null;
function botKnown(st,b){ const p=st.players[b], k={}; Object.entries((p.bot&&p.bot.known)||{}).forEach(([s,id])=>{ const c=p.slots[+s]; if(c&&c.id===id) k[+s]=c; }); return k; }
function rnd(a){ return a[Math.floor(Math.random()*a.length)]; }
function oppCards(st,b,exclude){ const out=[]; st.players.forEach((q,k)=>{ if(k===b||k===exclude) return; q.slots.forEach((c,u)=>{ if(c) out.push({p:k,u}); }); }); return out; }
const PACE={ botStep:[2800,3700], botReady:1500, coller:[1200,2400], fly:1700, flash:3400, dealGap:320, dealFly:800 };
const pace=([a,b])=>a+Math.random()*(b-a);
function botTick(){
  if(!G||!CODE||G.host!==ME) return;
  const st=G;
  if(botTimer){ clearTimeout(botTimer); botTimer=null; }
  if(st.phase==='peek'){ const b=st.players.find(p=>p.bot&&!p.ready); if(b){ botTimer=setTimeout(()=>{ if(G&&G.phase==='peek') actAs(b.id,'ready'); },PACE.botReady); } return; }
  if(st.phase==='reveal'&&st.caller!==null&&st.callerWon===false&&!st.players[st.caller].bot&&ui.teased!==st.seq){ ui.teased=st.seq; const bots=st.players.filter(p=>p.bot); if(bots.length){ const b=rnd(bots); setTimeout(()=>{ if(G&&G.phase==='reveal') actAs(b.id,'chat',{text:taunt(st.players[st.caller].name).replace(/\{n\}/g,'')}); },4500); } return; }
  if(st.phase!=='play') return;
  // collages
  const tp=top(st);
  if(tp) st.players.forEach((p,b)=>{ if(!p.bot) return; if(st.turn===b&&st.step!=='start') return;
    Object.entries(botKnown(st,b)).forEach(([s,c])=>{ if(c.r!==tp.r) return; const key=p.id+':'+c.id+':'+tp.id; if(botTried.has(key)) return; botTried.add(key);
      setTimeout(()=>{ const g=G; if(!g||g.phase!=='play') return; const t2=top(g); if(!t2||t2.r!==tp.r) return; const q=g.players.find(x=>x.id===p.id); if(!q) return; const bi=g.players.indexOf(q); if(q.slots[+s]&&q.slots[+s].id===c.id) actAs(p.id,'coller',{p:bi,s:+s,rank:tp.r}); },pace(PACE.coller)); });
  });
  if(st.closing) return;
  const cur=st.players[st.turn];
  if(cur&&cur.bot){ const seq=st.seq; botTimer=setTimeout(()=>{ if(G&&G.seq===seq) botTurn(st.turn); },pace(PACE.botStep)); }
}
function botTurn(b){
  const st=G, p=st.players[b]; if(!p||!p.bot||st.phase!=='play'||st.turn!==b||st.closing) return;
  const known=botKnown(st,b), slots=p.slots, tp=top(st);
  const unknown=slots.map((c,s)=>c&&known[s]==null?s:-1).filter(s=>s>=0);
  const ks=Object.entries(known).sort((x,y)=>val(y[1])-val(x[1]));
  const worst=ks[0]; const knownSum=ks.reduce((a,[,c])=>a+val(c),0);
  const anySlot=slots.findIndex(c=>c);
  if(st.step==='start'){
    if(canSurprise(st,b) && worst && val(worst[1])>=7){ const tg=rnd(oppCards(st,b)); if(tg) return actAs(p.id,'surprise',{s:+worst[0],p:tg.p,u:tg.u}); }
    if(st.caller===null && unknown.length===0 && count(p)>0 && (knownSum<=6 || (knownSum<=10&&Math.random()<.35))) return actAs(p.id,'tamalou');
    if(tp&&count(p)>0){ const tv=val(tp);
      if(worst && tv<=5 && tv<val(worst[1])-1){ botPlan[p.id]=+worst[0]; return actAs(p.id,'take'); }
      if(tv<=2 && unknown.length){ botPlan[p.id]=unknown[0]; return actAs(p.id,'take'); } }
    return actAs(p.id,'draw');
  }
  if(st.step==='fromDiscard'){ let s=botPlan[p.id]; if(s==null||!slots[s]) s=worst?+worst[0]:(unknown[0]??anySlot); botPlan[p.id]=null; return actAs(p.id,'swap',{s}); }
  if(st.step==='drawn'){
    const h=st.held, hv=val(h), pw=powerAvail(st,h,b);
    if(count(p)===0) return actAs(p.id,'discardHeld');
    if(pw && hv>=7){ const useful=pw==='own'?unknown.length>0:pw==='nine'?!!(worst&&val(worst[1])>=8):Math.random()<.6; if(useful) return actAs(p.id,'discardHeld'); }
    if(worst && hv<val(worst[1])-1) return actAs(p.id,'swap',{s:+worst[0]});
    if(hv<=4 && unknown.length) return actAs(p.id,'swap',{s:unknown[0]});
    return actAs(p.id,'discardHeld');
  }
  if(st.step==='power'){
    const k=st.power;
    if(k==='own'){ const s=unknown.length?unknown[0]:anySlot; return s>=0?actAs(p.id,'look',{p:b,s,kind:'own'}):actAs(p.id,'skipPower'); }
    if(k==='opp'){ const t=rnd(oppCards(st,b)); return t?actAs(p.id,'look',{p:t.p,s:t.u,kind:'opp'}):actAs(p.id,'skipPower'); }
    if(k==='nine'){ if(st.nineLook) return actAs(p.id,'nine'); if(!worst||val(worst[1])<7) return actAs(p.id,'skipPower'); const t=rnd(oppCards(st,b)); return t?actAs(p.id,'nineLook',{s:+worst[0],p:t.p,u:t.u}):actAs(p.id,'skipPower'); }
    if(k==='ten'){ const t1=rnd(oppCards(st,b)); const t2=t1?rnd(oppCards(st,b,t1.p)):null; return (t1&&t2)?actAs(p.id,'ten',{p:t1.p,u:t1.u,q:t2.p,v:t2.u}):actAs(p.id,'skipPower'); }
    return actAs(p.id,'skipPower');
  }
}

(async function boot(){
  render();
  ME=ls('tamalou-id')||('p-'+Math.random().toString(36).slice(2,12)); ls('tamalou-id',ME);
  ui.name=ls('tamalou-name')||'';
  if(cfgOk()&&window.supabase){ try{ SB=window.supabase.createClient(window.TAMALOU_CONFIG.supabaseUrl,window.TAMALOU_CONFIG.supabaseAnonKey); }catch(e){ SB=null; } }
  booted=true;
  if('serviceWorker' in navigator){ try{ navigator.serviceWorker.register('sw.js'); }catch(e){} }
  render();
  checkConn();
  const last=ls('tamalou-code'); if(SB&&last){ await openGame(last,true); }
  render();
})();
})();
</script>
</body>
